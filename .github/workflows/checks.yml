name: Check website pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Verified actions/checkout v4 ref on 2026-10-31.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the tested image dependency
        run: python -m pip install -r requirements.txt
      - name: Check empty and populated site behavior
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_site.py
